<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="main">
        <div class="txt">" Simple Calculator "</div>
        <div class="first">
            <div class="output"></div>
            <div class="input"></div>
        </div>
        <div class="second">
            <div id="change">i</div>
            <div class="box">(</div>
            <div class="box">)</div>
            <div class="box">AC</div>
            <div class="box">C</div>
            <div class="box">n!</div>
            <div class="box">π</div>
            <div class="box">1/x</div>
            <div class="box">|x|</div>
            <div class="box">%</div>
            <div class="box">x<sup>y</sup></div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
            <div class="box">/</div>
            <div class="box">x<sup>1/y</sup></div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">*</div>
            <div class="box">log</div>
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">-</div>
            <div class="box">ln</div>
            <div class="box">0</div>
            <div class="box">.</div>
            <div class="box">=</div>
            <div class="box">+</div>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
