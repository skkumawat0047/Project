<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Converter</title>
    <link rel="stylesheet" href="exchange.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main">
        <div class="block1">
            <div>Currency Converter</div>
            <h4>Enter Amount</h4>
            <input type="number" placeholder="Enter Amount">
        </div>

        <div class="block2">
            <div class="from">
                    <img src="https://flagsapi.com/US/flat/64.png">
                    <select name="FROM" id="Currency">
                    </select>
            </div>
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            <div class="from TO">
                <img src="https://flagsapi.com/IN/flat/64.png">
                <select name="TO" id="Currency">
                </select>
            </div>
        </div>
        <div class="msg">1USD=80INR</div>
        <div class="button">
        <button class="calculate">Gate Exchange Rate</button>
        </div>
    </div>
    <script src="codes.js"></script>
    <script src="xchange.js"></script>
</body>
</html>
