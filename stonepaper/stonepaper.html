<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone-Paper-Scissor</title>
    <link rel="stylesheet" href="stonepaper.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="text">Rock-Paper-Scissor</div>
    <div class="btns">
        <button class="button" id="rock">
            <i class="fa-solid fa-hand-fist"></i>
        </button>
        <button class="button" id="paper">
            <i class="fa-solid fa-hand"></i>
        </button>
        <button class="button" id="scissor">
            <i class="fa-regular fa-hand-peace"></i>
        </button>
    </div>
    <div class="count">
        <div class="you">
            <h2 class="yscore">0</h2>
            <h3>You</h3>
        </div>
        <div class="computer">
            <h2 class="cscore">0</h2>
            <h3>Comp.</h3>
        </div>
    </div>
    <div class="result">
        <button class="countmove">Pick your count</button>
    </div>
    <script src="stonepaper.js"></script>    
</body>
</html>
